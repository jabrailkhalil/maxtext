# =============================================================================
# CI metrics collector — scheduled workflow
# =============================================================================
#
# Keeps the CI Pulse dashboard data fresh by running the collector every four
# hours. The collector code lives on gh-pages (tools/ci_metrics/collector/);
# this workflow is the only file on main.
#
# What it does:
#   1. Checks out collector code from gh-pages
#   2. Fetches GitHub Actions data (runs, jobs, JUnit artifacts)
#   3. Stores raw data on the ci-metrics-store branch
#   4. Publishes rendered views to gh-pages for the dashboard
#
# Prerequisites:
#   - ci-metrics-store branch must exist (orphan, created once)
#   - GITHUB_TOKEN needs actions:read and contents:write
#
# Why 20 minutes past the hour: offset from the benchmark writer that pushes
# on the whole-four-hour clock. concurrency with cancel-in-progress: false
# covers the other race: a slow tick queues the next one instead of running
# twice.
# =============================================================================

name: CI metrics collector

on:
  schedule:
    # Every four hours, twenty minutes past, offset from the other writer on this repository.
    - cron: '20 */4 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Collect runs created on or after this day (YYYY-MM-DD). Empty = from the stored watermark.'
        required: false
        default: ''
      until:
        description: 'Collect runs created on or before this day (YYYY-MM-DD). Empty = up to now.'
        required: false
        default: ''
      backfill_days:
        description: 'How far back the first tick of an empty store reaches.'
        required: false
        default: '30'
      max_runs:
        description: 'Stop after this many runs. Empty = no cap.'
        required: false
        default: ''
      dry_run:
        description: 'Fetch and compute everything, write nothing.'
        type: boolean
        required: false
        default: false

# One writer of this store, and a slow tick queues rather than racing itself.
concurrency:
  group: ci-metrics-collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect:
    name: Collect one tick
    # Always a GitHub-hosted runner. This job must never take a self-hosted machine: those
    # belong to the pipeline being measured, and a collector that competes for them would
    # change the very queue times it reports.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # The repository whose pipeline is measured. Read-only, every request a GET.
      TARGET_REPO: AI-Hypercomputer/maxtext
      # The branch holding this collector's code (tools/ci_metrics/collector).
      COLLECTOR_REF: gh-pages
      # The branch the store is committed to, and the directory inside it. This branch is
      # this project's own: it is never gh-pages and never a branch of the pipeline's work.
      STORE_BRANCH: ci-metrics-store
      STORE_DIR: ci-metrics
      # The branch GitHub Pages serves from. The publish step copies the rendered views here.
      PAGES_BRANCH: gh-pages
      PAGES_VIEWS_DIR: dev/bench/ci-pulse/views

    steps:
      - name: Check out the collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.COLLECTOR_REF }}
          path: collector-src
          persist-credentials: false

      - name: Check out the store branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.STORE_BRANCH }}
          path: store
          # The whole history: a tick appends to it and pushes, so a shallow clone cannot
          # rebase onto a tip it does not have. The store branch is squashed yearly, which is
          # what keeps this affordable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'requests>=2.31,<3'

      - name: Run the tick
        id: tick
        shell: bash
        env:
          # A token for the pipeline repository when one is configured, the built-in token
          # otherwise. Artifact downloads need `actions:read` on the repository being read.
          GITHUB_TOKEN: ${{ secrets.CI_METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
          MAX_RUNS: ${{ inputs.max_runs }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          args=(--out "${GITHUB_WORKSPACE}/store/${STORE_DIR}" --repo "${TARGET_REPO}")
          [ -n "${SINCE}" ] && args+=(--since "${SINCE}")
          [ -n "${UNTIL}" ] && args+=(--until "${UNTIL}")
          [ -n "${BACKFILL_DAYS}" ] && args+=(--backfill-days "${BACKFILL_DAYS}")
          [ -n "${MAX_RUNS}" ] && args+=(--max-runs "${MAX_RUNS}")
          [ "${DRY_RUN}" = "true" ] && args+=(--dry-run)

          cd "${GITHUB_WORKSPACE}/collector-src/tools/ci_metrics" || exit 1
          python -m collector.tick "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/tick.log"
          status=${PIPESTATUS[0]}

          # 0 means the tick finished, whether or not it found anything new. 1 means it lost
          # data and should be looked at - but whatever it did collect is still committed
          # below, so the failure costs freshness and not rows. The job is failed at the end.
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "summary=$(tail -n 1 "${RUNNER_TEMP}/tick.log")" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Commit and push the store
        if: ${{ inputs.dry_run != true }}
        shell: bash
        working-directory: store
        env:
          # Read through the environment rather than interpolated into the script: a step
          # output must never become shell source, whatever produced it.
          TICK_SUMMARY: ${{ steps.tick.outputs.summary }}
        run: |
          set -euo pipefail
          # An unchanged store commits nothing. A tick that found no new run is a normal
          # outcome, not something to record as an empty commit six times a day.
          if [ -z "$(git status --porcelain -- "${STORE_DIR}")" ]; then
            echo "The store is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name 'ci-metrics-collector'
          git config user.email 'ci-metrics-collector@users.noreply.github.com'
          git add -- "${STORE_DIR}"

          # One commit per tick: it is the transaction boundary, so every file a tick
          # produced lands together or not at all. [skip ci] keeps the push from starting the
          # pipeline's own workflows.
          # The subject carries the marker, the body carries the counts.
          git commit -m "ci-metrics: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" -m "${TICK_SUMMARY}"

          # The collector is the only writer of this branch, so a rejection means a human
          # edited it. Rebase and try again, three times, then give up loudly.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${STORE_BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto the branch tip."
            git pull --rebase origin "${STORE_BRANCH}"
          done
          echo "The store could not be pushed after three attempts." >&2
          exit 1

      - name: Check out gh-pages for publishing
        if: ${{ inputs.dry_run != true && steps.tick.outputs.status == '0' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: pages
          fetch-depth: 0

      - name: Publish views to gh-pages
        if: ${{ inputs.dry_run != true && steps.tick.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          STORE_VIEWS="${GITHUB_WORKSPACE}/store/${STORE_DIR}/views"
          TARGET="${GITHUB_WORKSPACE}/pages/${PAGES_VIEWS_DIR}"

          if [ ! -f "${STORE_VIEWS}/meta.json" ]; then
            echo "No views to publish (no meta.json in store)."
            exit 0
          fi

          # Replace the views directory wholesale: the store rebuild is the
          # source of truth and always covers every month the previous one did.
          rm -rf "${TARGET}"
          mkdir -p "$(dirname "${TARGET}")"
          cp -R "${STORE_VIEWS}" "${TARGET}"
          echo "Copied $(find "${TARGET}" -type f -name '*.json' | wc -l | tr -d ' ') view file(s)."

          cd "${GITHUB_WORKSPACE}/pages" || exit 1
          if [ -z "$(git status --porcelain -- "${PAGES_VIEWS_DIR}")" ]; then
            echo "Views unchanged; nothing to publish."
            exit 0
          fi

          git config user.name 'ci-metrics-collector'
          git config user.email 'ci-metrics-collector@users.noreply.github.com'
          git add -- "${PAGES_VIEWS_DIR}"
          git commit -m "ci-metrics: refresh dashboard data [skip ci]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${PAGES_BRANCH}"; then
              echo "Published to ${PAGES_BRANCH} on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing."
            git pull --rebase origin "${PAGES_BRANCH}"
          done
          echo "Could not push to ${PAGES_BRANCH} after three attempts." >&2
          exit 1

      - name: Report what the tick did
        if: always()
        shell: bash
        env:
          TICK_SUMMARY: ${{ steps.tick.outputs.summary }}
          TICK_STATUS: ${{ steps.tick.outputs.status }}
        run: |
          echo "${TICK_SUMMARY} (exit ${TICK_STATUS})" >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail the job when the tick lost data
        if: ${{ always() && steps.tick.outputs.status != '0' }}
        shell: bash
        env:
          TICK_STATUS: ${{ steps.tick.outputs.status }}
        run: |
          echo "The tick exited ${TICK_STATUS}: it lost data or could not write." >&2
          echo "Repeating a tick is always safe - re-run this workflow once the cause is fixed." >&2
          exit 1
