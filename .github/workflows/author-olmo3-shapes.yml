name: Author OLMo3 shape verification
on:
  push:
    branches: [validation/olmo3-shapes-oct12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            mode: base
          - os: ubuntu-latest
            python: '3.12'
            mode: head
          - os: macos-latest
            python: '3.13'
            mode: base
          - os: macos-latest
            python: '3.13'
            mode: head
          - os: windows-latest
            python: '3.14'
            mode: base
          - os: windows-latest
            python: '3.14'
            mode: head
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Fetch only pinned source revisions
        run: git fetch --no-tags --depth=1 origin a230f3e3def30651d55512307285a4298c8ff015 2bda00aeb150572c1fcd81c918fc6f0778132fc8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test dependencies
        run: python -m pip install jax==0.11.2 numpy==2.5.4 pytest==9.1.1 pathwaysutils==0.1.11 absl-py==2.5.0 filelock==4.1.1
      - name: Verify exact head or expected baseline failures
        run: python author_validation_olmo3.py ${{ matrix.mode }}
